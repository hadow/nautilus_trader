[package]
name = "nautilus-longbridge"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Longbridge OpenAPI integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_longbridge"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
examples = ["nautilus-live/node", "nautilus-trading/examples"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-live/extension-module",
  "nautilus-model/extension-module",
  "pyo3/extension-module",
  "python",
]
python = [
  "dep:nautilus-system",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-live/python",
  "nautilus-model/python",
  "nautilus-system/python",
  "pyo3",
  "pyo3-stub-gen",
]
high-precision = ["nautilus-model/high-precision"]

[package.metadata.cargo-machete]
ignored = ["nautilus-system"]

[package.metadata.docs.rs]
features = ["examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
longbridge = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-backtest = { workspace = true }
nautilus-indicators = { workspace = true }
nautilus-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nautilus-trading = { workspace = true }

rstest = { workspace = true }
toml = { workspace = true, features = ["display"] }

[[example]]
name = "longbridge-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

[[example]]
name = "longbridge-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

[[example]]
name = "longbridge-grid-mm"
path = "examples/node_grid_mm.rs"
required-features = ["examples"]
doc = false

[[example]]
name = "longbridge-range-fakeout-backtest"
path = "examples/node_range_fakeout_backtest.rs"
required-features = ["examples"]
doc = false

[[example]]
name = "longbridge-slc-trader"
path = "examples/node_slc_trader.rs"
required-features = ["examples"]
doc = false

[[test]]
name = "python"
path = "tests/python.rs"
required-features = ["python"]
