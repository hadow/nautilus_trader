# SLC 统一配置文件。金额、价格、数量使用字符串，避免浮点数损失精度。
# 命令未指定其他文件时，实盘和回测都读取本文件。

[longbridge]
# OAuth 2.0 公共客户端 ID；不是 access token，也不是客户端密钥。
#mac
oauth_client_id = "2bcd116c-41bc-4ad5-8d73-280f0d53b1e4"
#wsl
#oauth_client_id = "158c3901-18c6-4caa-9fc6-043775e0ea07"

# OAuth 浏览器授权完成后，本机接收回调的 TCP 端口；必须大于 0。
oauth_callback_port = 60355
# true 路由到 Longbridge 模拟盘；false 路由到真实账户。
papertrading = true
# 风险账本保存当日交易次数、已实现盈亏和未释放风险；相对路径以本文件目录为基准。
paper_risk_state_path = "../../../../target/longbridge-slc-paper-risk-state.toml"
# 实盘使用独立账本，禁止与模拟盘共享状态。
live_risk_state_path = "../../../../target/longbridge-slc-live-risk-state.toml"

[universe]
# 交易市场：us 使用纽约时区；hk 使用香港时区、午休和港币/整手校验。
market = "us"
# 实盘标的池模式：fixed 使用本文件底部的 [[symbols]]；dynamic 读取盘前选择器生成的当日快照。
# 回测始终使用固定 [[symbols]]，避免把某一天的动态池错误套用到历史区间。
mode = "fixed"
# 动态池快照路径；相对路径以本配置文件目录为基准。动态模式下文件缺失、日期过期或方向不一致
# 都会阻止交易节点启动，不会静默回退到固定池。
dynamic_pool_path = "../../../../target/longbridge-slc-dynamic-pool.toml"
# 最终动态池最多保留的标的数；所有标的仍共享 [risk] 下的仓位和风险额度。
max_symbols = 300
# Longbridge 每个方向先返回的候选数。both 会分别请求多头和空头并交替选取，最多共请求两倍数量。
candidate_count_per_side = 150
# Longbridge 静态信息不提供美股逐标的 tick；此处为动态池统一使用的保守报价格点。默认 0.01
# 对当前 minimum_price > 1 的主板池不会生成亚分价格；若券商规则变化，应先人工核对再修改。
price_increment = "0.01"
# 价格筛选范围，单位 USD；排除过低价格导致的跳动/滑点放大，也排除单股名义金额过高的标的。
minimum_price = "10"
maximum_price = "500"
# Longbridge 市值筛选输入值；美股筛选值 50 约对应 50 亿 USD，快照保存 API 返回的原始市值供审计。
minimum_market_cap = "50"
# 近一个月日均成交额下限，Longbridge 筛选单位为“万”；500 即约 500 万 USD。
minimum_average_daily_turnover = "800"
# 午間流動性回看最近幾個完整交易日；半日市自動排除。允許 1 至 10，5 日兼顧近期性與穩定性。
liquidity_lookback_days = 5
# 11:30-14:00（紐約時間）歷史 5 分鐘 K 線的每分鐘平均成交股數下限。缺失 K 線按零成交計算；
# 1000 股/分鐘用於排除成交集中在開收盤、午間實際流動性不足的標的，可依實盤滑點上調。
minimum_average_volume_per_minute = "1000"
# 午間「窒息 K 線」比例上限，0.05 表示 5%。缺失、零成交或 OHLC 四價完全相同均計入。
maximum_stale_bar_ratio = "0.05"
# 最近交易日振幅下限，单位百分比；保证候选有足够日内活动，但不直接构成 SLC 入场信号。
minimum_daily_amplitude_pct = "1.5"
# 多头候选要求最近涨幅位于该绝对值区间，空头候选使用对称负区间；用于构造方向均衡的活跃池。
minimum_daily_change_pct = "0.5"
maximum_daily_change_pct = "12"

# 视频 Manipulation Strategy 的可回测量化定义；1 小时确认明显流动性摆动，5 分钟执行 sweep、
# 反向 FVG 及 IFVG 收盘突破。仅由 longbridge-manipulation-* runner 使用。
[manipulation]
# 中心 K 线左右各需要两根完整 1 小时 K 线，确认后才成为流动性水平，避免 pivot 未来回写。
liquidity_swing_bars = 2
# 只保留最近 12 根 1 小时 K 线确认的流动性水平，每侧最多保留 8 个。
liquidity_level_ttl_bars = 12
max_liquidity_levels_per_side = 8
# sweep 后最多 3 根 5 分钟 K 线内形成反向 FVG，形成后最多 6 根内完成 IFVG 收盘突破。
fvg_search_bars = 3
inverse_fvg_ttl_bars = 6
# 用入场前 ATR 排除几乎不可见的 sweep，以及过小或过度扩张的 FVG。
minimum_sweep_atr = 0.10
minimum_fvg_atr = 0.15
maximum_fvg_atr = 0.4
# IFVG 收盘越过远端后最多允许继续延伸的 ATR，避免确认时追入已经扩张的行情。
maximum_inversion_atr = 0.5

# 独立跨日波段模型：日线过滤方向，4 小时确认流动性，1 小时形成 sweep/FVG，15 分钟收盘
# 完成 IFVG 入场。止损、仓位、订单和账户风险仍复用统一执行链。
[manipulation_swing]
# 最近 20 根完整日线的收盘价同时位于均值和窗口起点同一侧，才允许对应方向 setup。
daily_bias_bars = 20
# 中心 K 线左右各两根完整 4 小时 K 线确认流动性水平；水平最多保留约 15 个交易日。
liquidity_swing_bars = 2
liquidity_level_ttl_bars = 30
max_liquidity_levels_per_side = 8
# Sweep 后三根 1 小时 K 线内形成反向 FVG；随后最多一个完整常规交易日完成反转突破。
fvg_search_bars = 3
inverse_fvg_ttl_bars = 26
minimum_sweep_atr = 0.10
minimum_fvg_atr = 0.10
maximum_fvg_atr = 0.8
maximum_inversion_atr = 0.5
# 止盈止损可随时成交；无进展退出最早在第二个持仓交易日收盘，最晚第五日开盘后退出。
minimum_holding_sessions = 2
maximum_holding_sessions = 5

[risk]
# 单笔交易计划承担的最大初始风险，单位 USD；100 USD 为 100,000 USD 初始资金的 0.10%。
risk_amount = "200"
# 当日累计已实现亏损达到该值后，全部标的停止新开仓，单位 USD；当前相当于 2 笔计划风险。
daily_loss_limit = "400"
# 全账户所有挂单和持仓允许同时占用的初始风险上限，单位 USD；当前覆盖 3 个满风险仓位。
max_open_risk = "600"
# 全账户全部 SLC 仓位和入场挂单的总名义金额上限，单位 USD；不超过初始资金的 60%。
max_account_notional = "100000"
# 同时允许存在的入场预留或持仓数量；所有 symbol 共享该额度。
max_open_positions = 5
# 任意单笔入场订单的最大股数；为低价、窄止损标的保留足够风险容量。
max_order_quantity = "1000"
# 任意单个标的入场订单的最大名义金额，单位 USD；三个并发仓位各不超过 20,000。
max_order_notional = "20000"
# 实际预留风险/计划风险的最低比例；过小仓位会被拒绝，范围 0 至 1。
minimum_risk_utilization = "0.10"
# 限价入场相对信号收盘价最多放宽的最小价格跳动数，同时用于回测滑点压力。
max_entry_slippage_ticks = 5

[signal]
# 允许的入场方向：both、long 或 short；只影响新信号，不改变退出逻辑。
trade_direction = "both"
# 原策略允许首次回测和一次破位收复后的回测；reclaimed_only 仅用于对照实验。
level_selection = "all"
# 同一根 5 分钟 K 线信号的归集等待时间，单位毫秒；归集后按无权重质量字段依次排序。
batch_delay_ms = 2000
# 固定止盈倍数，以初始风险 R 为单位；文档要求至少 2R。
risk_reward = "3"
# 价格曾达到该浮盈 R 后启用利润保护；与下方保护线同时设为 0 可关闭。
profit_protection_trigger_r = "1"
# 价格达到首个触发档后，把券商端止损抬到的首个盈利 R；0.5R 保留回调空间。
profit_protection_floor_r = "0.5"
# MFE 每继续增加该 R，再把利润保护线同幅抬高；当前形成 1R→0.5R、1.5R→1R 两档。
profit_protection_step_r = "0.5"
# 持仓达到该数量的已完成 5 分钟 Bar 后，开始判断交易是否始终没有启动；0 与下方阈值全为 0 时关闭。
no_progress_exit_after_bars = 9
# 无进展退出要求持仓以来的最大有利波动严格小于该 R；0.5R 表示从未形成足够跟随。
no_progress_max_mfe_r = "0.5"
# 无进展退出同时要求当前完成 Bar 的收盘收益不高于该 R；0 表示只退出未盈利交易。
no_progress_max_current_r = "0"
# 止损在 zone 远端之外额外留出的最小价格跳动数。
stop_buffer_ticks = 2
# 初始止损波动距离模型：atr 仅使用 ATR 倍数，recent_range 仅使用最近 K 线区间，
# hybrid 取 ATR 距离、最近 K 线区间距离和 level 结构距离中的最大值。
stop_distance_model = "hybrid"
# 初始止损距最坏允许入场价至少为 level 创建/入场时较大 5 分钟 ATR 的多少倍。最终止损取
# zone 远端与该波动下限中更远者；在 atr 和 hybrid 模式下参与止损计算。
minimum_stop_atr_multiple = 2.0
# recent_range 模型读取最近多少根已完成 5 分钟 K 线；5 表示当前确认 K 线及其前 4 根。
recent_range_lookback_bars = 5
# recent_range 和 hybrid 模式的区间倍数：止损距离=(Max High-Min Low)*该倍数。
recent_range_multiple = "0.7"
# 5 分钟 Wilder ATR 周期；用于量化 displacement，并在 atr/hybrid 止损中衡量市场噪声。
atr_period = 10
# 创建 level 所需的最小位移强度，单位 ATR；1.5 用来排除普通波动形成的伪 level。
displacement_atr_multiple = 1.5
# 位移结束收盘价允许偏离位移极端的最大比例，范围 0 至 0.5，越小越严格。 默认 0.35
displacement_close_fraction = 0.3
# 一次有效 displacement 最多允许由多少根 5 分钟 Bar 完成，范围 1 至 12。默认 3
displacement_max_bars = 3
# “recent level”最多保留一个美股常规交易时段（78 根 5 分钟 Bar），超时后删除。
zone_ttl_bars = 78
# 可首次交易的 Level 必须至少保持该数量 Bar 未触达；15 根约 75 分钟，用于过滤位移后很快
# 回抽、尚未形成独立供需区的 setup。
minimum_fresh_level_age_bars = 15
# demand 和 supply 各自最多保留的 level 数，防止状态和扫描成本无界增长。
max_zones_per_side = 8
# 确认模型：level_response 验证价格是否立即拒绝 Level 或随后突破触达 K 线极值；
# stochastic_reentry 保留为随机指标极值回穿的 A/B 基线。
confirmation_model = "level_response"
# 价格触达 level 后允许完成确认的 5 分钟 Bar 数；5 表示触达 Bar 加后续最多 5 根。
confirmation_window_bars = 5
# Level Response 确认 K 线的方向收盘位置下限；0.65 表示做多收在振幅上方 35% 内，做空镜像。
minimum_confirmation_close_location = 0.65
# Stochastics %K 原始周期；Level Response 模式下仅作为诊断和 A/B 基线。
stochastic_k_period = 5
# Stochastics %K 平滑周期。
stochastic_k_smoothing = 3
# Stochastics %D 周期；当前信号使用 %K 阈值，但保留完整指标初始化。
stochastic_d_period = 3
# Stochastic Reentry 模式下，多头确认要求 %K 曾低于该超卖阈值。
oversold = 20.0
# Stochastic Reentry 模式下，空头确认要求 %K 曾高于该超买阈值。
overbought = 80.0
# 距离强制平仓至少保留的潜在运行时间；晚于该边界不再开仓，单位分钟。
minimum_target_time_minutes = 60

[warmup]
# 启动前加载的已完成 5 分钟 Bar 数，用于初始化 ATR、随机指标和近期位移窗口。
five_minute_bars = 50
# 波段模型的 15 分钟近期区间和 IFVG 触发预热。
fifteen_minute_bars = 40
# 启动前加载的已完成 1 小时 Bar 数；仅用于对照滚动 4x1h 诊断，不参与交易授权。
one_hour_bars = 60
# 启动前加载的已完成原生 4 小时 Bar 数；最后两根以 HH/HL 或 LH/LL 判定交易方向。
four_hour_bars = 30
# 波段模型使用 20 日方向窗口，额外历史为新样本边界提供稳定余量。
daily_bars = 30

[session]
# 允许提交新入场的最早纽约时间，格式 HH:MM，不能早于 09:30。
entry_start = "09:35"
# 配置层面的最晚入场纽约时间；还会受 minimum_target_time_minutes 进一步收紧。
entry_end = "15:30"
# 距 Longbridge 当日常规收盘多少分钟开始撤单并强制平仓。
flatten_before_close_minutes = 10
# 每个 symbol 每个纽约交易日最多允许的入场次数。
max_trades_per_day = 10

[backtest]
# 回测样本起点和终点，必须使用 UTC 时间戳且 start < end。
start = "2026-07-01T00:00:00Z"
end = "2026-07-31T23:59:59Z"
# 同一数据和止损规则下比较文档原始 2R 与扩展 3R，避免只看单一目标误判退出质量。
risk_rewards = ["2", "3"]
# 回测组合初始资金；用于收益率、Sharpe、回撤和 Calmar 计算。
starting_balance = "100_000 USD"
# 下载全部历史数据允许的总超时秒数；一年多标的数据需为限流留足时间。
timeout_secs = 3600
# true 输出每根 Bar 的详细诊断；多标的会产生大量日志。
log_bars = false
# 回测及模拟/实盘诊断按成交股数扣除的估算往返成本，单位 USD/股。
round_trip_cost_per_share = "0.01"

