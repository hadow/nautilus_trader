# SLC 统一配置文件。金额、价格、数量使用字符串，避免浮点数损失精度。
# 命令未指定其他文件时，实盘和回测都读取本文件。

[longbridge]
# OAuth 2.0 公共客户端 ID；不是 access token，也不是客户端密钥。
oauth_client_id = "2bcd116c-41bc-4ad5-8d73-280f0d53b1e4"
# OAuth 浏览器授权完成后，本机接收回调的 TCP 端口；必须大于 0。
oauth_callback_port = 60355
# true 路由到 Longbridge 模拟盘；false 路由到真实账户。
papertrading = true
# 仅 papertrading=false 时校验；必须精确填写 I_UNDERSTAND_LIVE_ORDERS 才允许实盘启动。
live_order_ack = ""
# 风险账本保存当日交易次数、已实现盈亏和未释放风险；相对路径以本文件目录为基准。
paper_risk_state_path = "../../../../target/longbridge-slc-paper-risk-state.toml"
# 实盘使用独立账本，禁止与模拟盘共享状态。
live_risk_state_path = "../../../../target/longbridge-slc-live-risk-state.toml"

[risk]
# 单笔交易计划承担的最大初始风险，单位 USD；仓位数量由该值除以每股风险得到。
risk_amount = "25"
# 当日累计已实现亏损达到该值后，全部标的停止新开仓，单位 USD。
daily_loss_limit = "200"
# 全账户所有挂单和持仓允许同时占用的初始风险上限，单位 USD。
max_open_risk = "300"
# 全账户全部 SLC 仓位和入场挂单的总名义金额上限，单位 USD。
max_account_notional = "10000"
# 同时允许存在的入场预留或持仓数量；所有 symbol 共享该额度。
max_open_positions = 3
# 任意单笔入场订单的最大股数。
max_order_quantity = "500"
# 任意单个标的入场订单的最大名义金额，单位 USD。
max_order_notional = "5000"
# 实际预留风险/计划风险的最低比例；过小仓位会被拒绝，范围 0 至 1。
minimum_risk_utilization = "0.10"
# 限价入场相对信号收盘价最多放宽的最小价格跳动数，同时用于回测滑点压力。
max_entry_slippage_ticks = 5

[signal]
# 允许的入场方向：both、long 或 short；只影响新信号，不改变退出逻辑。
trade_direction = "both"
# 固定止盈倍数，以初始风险 R 为单位；2 表示目标为 2R。
risk_reward = "2"
# 止损在 zone 远端之外额外留出的最小价格跳动数。
stop_buffer_ticks = 1
# 5 分钟 Wilder ATR 周期；用于位移、距离和区域宽度归一化。
atr_period = 14
# 创建 level 所需的最小位移强度，单位 ATR。
displacement_atr_multiple = 1.0
# 位移结束收盘价允许偏离位移极端的最大比例，范围 0 至 0.5，越小越严格。
displacement_close_fraction = 0.35
# 一次有效 displacement 最多允许由多少根 5 分钟 Bar 完成，范围 1 至 12。
displacement_max_bars = 3
# 4 小时 pivot 左右各需多少根已完成 Bar 确认；越大越稳定但趋势识别越慢。
pivot_span = 2
# level 最多保留的 5 分钟 Bar 数，超时后删除。
zone_ttl_bars = 234
# demand 和 supply 各自最多保留的 level 数，防止状态和扫描成本无界增长。
max_zones_per_side = 8
# 价格触达 level 后，允许等待随机指标回穿的 5 分钟 Bar 数。
confirmation_window_bars = 3
# 确认收盘价距离 level 的最大 ATR 倍数；越小越要求贴近区域完成确认。
confirmation_max_distance_atr = 0.35
# 确认 Bar 必须收在交易方向一侧的最低位置比例，范围 0 至 1。
confirmation_min_close_location = 0.55
# Stochastics %K 原始周期。
stochastic_k_period = 5
# Stochastics %K 平滑周期。
stochastic_k_smoothing = 3
# Stochastics %D 周期；当前信号使用 %K 阈值，但保留完整指标初始化。
stochastic_d_period = 3
# 多头确认要求 %K 曾低于该超卖阈值。
oversold = 20.0
# 空头确认要求 %K 曾高于该超买阈值。
overbought = 80.0
# 距离强制平仓至少保留的潜在运行时间；晚于该边界不再开仓，单位分钟。
minimum_target_time_minutes = 60
# 入场后达到该 5 分钟 Bar 数且 MFE 不足时触发时间止损。
time_stop_bars = 36
# 时间止损要求的最低最大有利波动，单位 R；达到该值则继续持有。
time_stop_minimum_mfe_r = "0.5"

[warmup]
# 启动前加载的已完成 5 分钟 Bar 数，用于初始化 ATR、随机指标和近期位移窗口。
five_minute_bars = 500
# 启动前加载的已完成 4 小时 Bar 数，用于确认 pivot 和初始结构。
four_hour_bars = 60

[session]
# 允许提交新入场的最早纽约时间，格式 HH:MM，不能早于 09:30。
entry_start = "09:35"
# 配置层面的最晚入场纽约时间；还会受 minimum_target_time_minutes 进一步收紧。
entry_end = "15:30"
# 距 Longbridge 当日常规收盘多少分钟开始撤单并强制平仓。
flatten_before_close_minutes = 10
# 每个 symbol 每个纽约交易日最多允许的入场次数。
max_trades_per_day = 20

[backtest]
# 回测样本起点和终点，必须使用 UTC 时间戳且 start < end。
start = "2026-08-03T00:00:00Z"
end = "2026-08-31T23:59:59Z"
# 可选 walk-forward 切分点；启用时取消下一行注释，且必须严格位于样本区间内。
# walk_forward_split = "2026-08-20T00:00:00Z"
# 要比较的止盈 R 倍数；只含一个值时运行单参数完整样本回测。
risk_rewards = ["2"]
# 回测组合初始资金；用于收益率、Sharpe、回撤和 Calmar 计算。
starting_balance = "100_000 USD"
# 下载全部历史数据允许的总超时秒数。
timeout_secs = 500
# true 输出每根 Bar 的详细诊断；30 个标的会产生大量日志。
log_bars = false
# 保守统计按成交股数扣除的估算往返成本，单位 USD/股。
round_trip_cost_per_share = "0.01"

