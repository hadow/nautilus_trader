# Wyckoff 第一阶段研究配置。OOS 起点以后数据不参与信号或参数选择。

[longbridge]
# OAuth 公共客户端 ID；token 仍由 Longbridge SDK 的本地安全存储管理。
oauth_client_id = "2bcd116c-41bc-4ad5-8d73-280f0d53b1e4"
oauth_callback_port = 60355

[study]
# download_start 只为 ATR、分时 RVOL 和滚动状态预热，不计入绩效。
download_start = "2025-09-01T00:00:00Z"
in_sample_start = "2025-11-01T00:00:00Z"
validation_start = "2026-03-01T00:00:00Z"
out_of_sample_start = "2026-05-01T00:00:00Z"
end = "2026-09-01T00:00:00Z"
timeout_secs = 3600
# 少于该交易数的候选不能成为验证阶段胜者。
minimum_trades = 30

[execution]
starting_balance = "100_000 USD"
risk_amount = "100"
daily_loss_limit = "300"
max_open_positions = 3
max_trades_per_day = 6
max_trades_per_symbol = 2
max_order_quantity = "1000"
max_order_notional = "20000"
# 10:00 前只构造 Opening Range；15:50 强制平仓。
entry_start = "10:00"
entry_end = "15:00"
flatten_time = "15:50"
stop_buffer_atr = 0.10
# 市价单在下一根 Bar 开盘成交；价差和滑点分别作用于买卖两端。
spread_bps = "2"
slippage_bps = "2"
round_trip_cost_per_share = "0.01"

[[symbols]]
symbol = "NVDA.US"
price_increment = "0.01"

